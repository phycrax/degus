[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
degus-config = { path = "crates/config" }
degus-controls = { path = "crates/controls" }
degus-icl = { path = "crates/icl" }
degus-project = { path = "crates/project" }
degus-wae = { path = "crates/wae" }

[profile.dev.package."*"]
opt-level = 3
