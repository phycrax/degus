[package]
name = "degus-sim-gui"
version.workspace = true
edition.workspace = true
description = "The window of the degus display simulator"

[dependencies]
degus-sim.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
image = { version = "0.25.10", default-features = false }
rodio = { version = "0.23.0", default-features = false, features = ["playback"], optional = true }

[features]
default = ["audio"]
## Plays the sounds on the default output device.
audio = ["dep:rodio"]
