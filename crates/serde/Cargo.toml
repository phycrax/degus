[package]
name = "degus-serde"
version.workspace = true
edition.workspace = true
description = "Encodes and decodes the values DWIN T5L displays hold in their VPs, with serde"
categories = ["embedded", "no-std", "encoding"]

[dependencies]
defmt = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
degus-codec.workspace = true
hex-literal.workspace = true
serde = { workspace = true, features = ["derive", "std"] }

[features]
## Derives `defmt::Format` for the errors.
defmt = ["dep:defmt"]
