[package]
name = "degus-sim"
version.workspace = true
edition.workspace = true
description = "Simulates a DWIN T5L display running a degus project"

[dependencies]
degus-config.workspace = true
degus-controls.workspace = true
degus-icl.workspace = true
degus-project.workspace = true
degus-wae.workspace = true
embedded-graphics = "0.8.2"
encoding_rs = "0.8.44"
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "jpeg", "gif"] }
serialport = { version = "4.10.1", default-features = false, optional = true }
thiserror = "2.0.21"

[features]
## Serial port links.
serial = ["dep:serialport"]

[dev-dependencies]
hound = "3.5.1"
