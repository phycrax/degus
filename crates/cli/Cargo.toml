[package]
name = "degus-cli"
version.workspace = true
edition.workspace = true
description = "The degus command: runs a DWIN_SET on a simulated DWIN T5L display"

[[bin]]
name = "degus"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
degus-codec.workspace = true
degus-set.workspace = true
degus-sim.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"], optional = true }
serialport = { version = "4.10.1", default-features = false, optional = true }

[features]
default = ["audio", "serial"]
## Plays the display's clips and beeps on the default output device.
audio = ["dep:rodio"]
## `degus sim --serial` links a host over a serial port.
serial = ["dep:serialport"]
