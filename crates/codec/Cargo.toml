[package]
name = "degus-codec"
version.workspace = true
edition.workspace = true
description = "Builds and parses the UART frames of DWIN T5L displays"
categories = ["embedded", "no-std", "encoding"]

[dependencies]
crc.workspace = true
defmt = { workspace = true, optional = true }
thiserror = { workspace = true, default-features = false }

[dev-dependencies]
hex-literal.workspace = true

[features]
## Derives `defmt::Format` for the public types.
defmt = ["dep:defmt"]
